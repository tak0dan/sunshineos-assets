# Sunshine OS terminal theme: the distribution palette (indigo background #0e1422, cream text #efe5d0, accent #ff9654), 20% transparent background.
font_family      JetBrainsMono Nerd Font
font_size 11.0
cursor_shape beam
confirm_os_window_close 0
window_padding_width 12

background_opacity 0.80
dynamic_background_opacity yes
background_blur 20

background #0e1422
foreground #efe5d0
cursor #ff9654
cursor_text_color #0e1422
selection_background #262f47
selection_foreground #efe5d0
url_color #ff9654
